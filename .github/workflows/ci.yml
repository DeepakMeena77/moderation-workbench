# CI staged by slice (docs/05-test-plan.md sec. 11). S0: verify + the UI suite for /status. S1: the demo
# users are seeded before the UI suite, which adds the sign-in page and the app shell.
# S8: the verify job also runs the AI evaluation with the mock provider, as a pipeline check.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Throwaway Postgres service container; "user" and "password" are placeholders, not secrets.
  DATABASE_URL: postgresql://user:password@localhost:5432/workbench
  DIRECT_URL: postgresql://user:password@localhost:5432/workbench
  LOG_LEVEL: warn
  # Throwaway values for CI only; real ones live in Vercel and the git-ignored .env files.
  SESSION_SECRET: ci-only-session-secret-placeholder-000000
  DEMO_MODE: 'true'
  DEMO_PASSWORD: ci-only-demo-password

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: workbench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d workbench"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run verify
      - run: npm run eval -- --mock

  browser:
    needs: verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: workbench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d workbench"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npm run db:seed
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
